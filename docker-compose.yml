version: '3.8'

services:
  backend:
    build: ./firewall-project/backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - API_KEY=changeme
    volumes:
      - ./firewall-project/backend:/app

  dashboard:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./firewall-project/dashboard:/usr/share/nginx/html:ro
